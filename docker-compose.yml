services:
  db:
    image: postgres:18-alpine
    container_name: mando_voc_db
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql
      - ./conf/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    image: mando_voc_server
    container_name: mando_voc_server
    build:
      dockerfile: conf/docker/Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./packages/server/.env
    ports:
      - 5174:5174
    healthcheck:
      test: curl --fail http://localhost:5174/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    image: mando_voc_client
    container_name: mando_voc_client
    build:
      dockerfile: conf/docker/Dockerfile
      target: client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - 5173:80

volumes:
  pg_data: {}