services:
  server:
    image: mando_voc_server
    container_name: mando_voc_server
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: server
    env_file:
      - ./packages/server/.env.dev
    restart: no
    ports:
      - 5174:5174
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/server/node_modules

  client:
    image: mando_voc_client
    container_name: mando_voc_client
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: client
    restart: no
    depends_on:
      - server
    ports:
      - 5173:5173
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/client/node_modules